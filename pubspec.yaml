name: tamago_alive
description: "TAMAGO ALIVE — A Virtual Pet Simulation that actually feels alive."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^16.3.2
  sensors_plus: ^4.0.2
  audioplayers: ^5.2.1
  flutter_animate: ^4.3.0
  confetti_widget: ^0.4.0
  vibration: ^1.8.4
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  intl: ^0.19.0
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  fonts:
    - family: TamagoIcons
      fonts:
        - asset: assets/fonts/placeholder.ttf
